name: equipment_form_app
description: Guardrail setup for the equipment form mobile app.
publish_to: 'none'
version: 0.0.1+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  go_router: ^14.2.8
  flutter_riverpod: ^2.5.1
  drift: ^2.17.0
  path_provider: ^2.1.4
  flutter_secure_storage: ^9.2.2
  path: ^1.9.0
  freezed_annotation: ^2.4.1
  json_annotation: ^4.9.0
  sqlite3_flutter_libs: ^0.5.24
  google_mlkit_text_recognition: ^0.13.0
  pdf: ^3.10.7
  printing: ^5.13.0
  intl: ^0.19.0
  image_picker: ^1.0.7
  # Pinned to 4.x due to crop_your_image; legacy helpers shimmed in lib/core/img_compat.dart.
  image: ^4.1.7
  exif: ^3.1.3
  heic_to_jpg: ^0.2.0
  yaml: ^3.1.2
  crop_your_image: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.2
  build_runner: ^2.4.11
  drift_dev: ^2.17.0
  freezed: ^2.4.7
  json_serializable: ^6.7.1
  crypto: ^3.0.3

flutter:
  uses-material-design: true
  assets:
    - assets/samples/ocr/eqpt_details/
    - assets/fonts/
    - assets/diagnostics/ocr_bench.json
    - EquipmentForm/eqpt_template_ref/field_map.yaml
