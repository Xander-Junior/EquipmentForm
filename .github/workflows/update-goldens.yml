cat > .github/workflows/update-goldens.yml <<'YAML'
name: Update PDF Goldens
on:
  workflow_dispatch:
    inputs:
      pr_branch:
        description: 'Branch to push golden updates to'
        required: true
  pull_request:
    types: [labeled]
permissions:
  contents: write
  pull-requests: write
jobs:
  update-goldens:
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' && github.event.label.name == 'golden-approve')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.inputs.pr_branch || github.head_ref }}
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Flutter pub get
        run: flutter pub get
      - name: Re-record goldens
        run: flutter test --update-goldens test/goldens/pdf
      - name: Commit & push golden updates
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "test(pdf): update goldens via CI"
            git push
          else
            echo "No golden changes."
          fi
YAML

